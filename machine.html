<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A useless machine about a habitat that refuses to disappear.">
    <title>The Stubborn Habitat · Vanishing Wild</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="machine.css">
    <link rel="icon" href="favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <header id="site-header"></header>
    <main class="machine-page">
        <h1>The Stubborn Habitat</h1>
        <p>Press one button to erase the forest. The machine has a different idea.</p>
        <div id="machine" class="machine" data-state="ready">
            <div class="machine-view" aria-hidden="true">
                <img class="machine-photo" src="images/wildlife-hero.jpg" alt="">
                <span class="machine-empty">Habitat missing.</span>
            </div>
            <p id="machine-status" role="status">The forest is still here.</p>
            <button id="shutter" type="button" aria-disabled="false">Erase this habitat</button>
        </div>
        <noscript><p>This habitat needs JavaScript to resist the button.</p></noscript>
    </main>
    <footer id="site-footer"></footer>
    <script src="nav.js"></script>
    <script src="machine.js"></script>
</body>
</html>
