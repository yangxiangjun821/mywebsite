<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A camera that refuses to keep its photographs.">
    <title>The Uncapturable Moment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="machine.css">
    <link rel="icon" href="favicon-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>
    <header id="site-header"></header>
    <main class="machine-page">
        <h1>The Uncapturable Moment</h1>
        <p>Some moments are better lived than kept.</p>
        <div id="machine" class="machine" data-state="ready">
            <div class="machine-view" aria-hidden="true">
                <img class="machine-photo" src="images/camera.jpg" alt="">
                <span class="machine-empty">A moment, waiting.</span>
            </div>
            <p id="machine-status" role="status">Ready when you are.</p>
            <button id="shutter" type="button" aria-disabled="false">Capture the moment</button>
        </div>
        <noscript><p>This camera needs JavaScript to capture and forget a moment.</p></noscript>
    </main>
    <footer id="site-footer"></footer>
    <script src="nav.js"></script>
    <script src="machine.js"></script>
</body>
</html>
