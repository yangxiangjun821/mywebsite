<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanishing Wild — Poster sketch</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f2f0e7; font-family: "Segoe UI", Arial, sans-serif; }
        .poster {
            width: 1200px;
            height: 630px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 100px 120px;
            color: #f5f1e6;
            background: #183a2e;
            position: relative;
        }
        .poster::before {
            content: "";
            position: absolute;
            inset: 64px;
            border: 3px solid #d59a3a;
            pointer-events: none;
        }
        h1 { max-width: 850px; margin: 0 0 28px; font-family: Georgia, serif; font-size: 90px; line-height: 1.08; }
        p { max-width: 850px; margin: 0; color: #d9dfd2; font-size: 30px; line-height: 1.5; }
    </style>
</head>
<body>
    <main class="poster">
        <h1>Vanishing Wild</h1>
        <p>Meet endangered animals. Understand what their survival asks of us.</p>
    </main>
</body>
</html>
